<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact &mdash; CBE Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #388bfd;
    --accent-deep: #1f6feb;
    --danger: #f85149;
    --ok: #3fb950;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 540px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 38px 36px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    animation: rise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    display: block;
    width: 180px;
    margin: 0 auto 16px;
  }

  h1 {
    text-align: center;
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: var(--text);
  }

  h1 em {
    font-style: normal;
    color: var(--accent);
  }

  .sub {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 300;
    margin: 8px 0 30px;
  }

  .field { margin-bottom: 18px; }

  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 7px;
  }

  input, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    resize: vertical;
  }

  input::placeholder, textarea::placeholder { color: #565e6b; }

  input:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.15);
  }

  textarea { min-height: 140px; }

  button {
    width: 100%;
    margin-top: 6px;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    background: var(--accent-deep);
    transition: background 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  button:hover { background: var(--accent); }
  button:active { transform: scale(0.99); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  button.loading .spinner { display: inline-block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .status {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    text-align: center;
    animation: fadeIn 0.3s ease both;
  }
  .status.ok    { background: rgba(63, 185, 80, 0.1);  border: 1px solid rgba(63, 185, 80, 0.4);  color: #56d364; }
  .status.error { background: rgba(248, 81, 73, 0.1);  border: 1px solid rgba(248, 81, 73, 0.4);  color: #ff7b72; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .success {
    display: none;
    text-align: center;
    padding: 32px 10px;
    animation: rise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .success .check {
    width: 68px; height: 68px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--ok);
    display: flex; align-items: center; justify-content: center;
    animation: pop 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.4) both;
  }
  .success .check svg { width: 30px; height: 30px; stroke: #0d1117; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .success h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
  .success p  { color: var(--muted); font-size: 0.9rem; font-weight: 300; }
  .success a  { color: var(--accent); text-decoration: none; font-weight: 500; }
  .success a:hover { text-decoration: underline; }

  @keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  form.out { opacity: 0; transform: translateY(-8px); transition: opacity 0.3s, transform 0.3s; pointer-events: none; }

  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 300;
  }
  .footer a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
  .footer a:hover { color: var(--text); }

  @media (max-width: 480px) {
    .card { padding: 28px 20px 24px; }
    h1 { font-size: 1.25rem; }
  }
</style>
</head>
<body>

  <main class="card">

    <!-- CBE Studio logo -->
    <img class="logo" src="https://raw.githubusercontent.com/CBE-STUDIO/CBE-STUDIO/main/assets/cbe-studio-logo.png" alt="CBE Studio logo">

    <h1>Contact <em>CBE Studio</em></h1>
    <p class="sub">Questions, feedback or a project idea &mdash; send a message and I'll get back to you.</p>

    <!-- Contact form -> Formspree -->
    <form id="contact-form" action="https://formspree.io/f/xyekdqjo" method="POST">
      <input type="hidden" name="_subject" value="New message from your website">

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Jane Doe" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="_replyto" placeholder="jane@example.com" required>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Hi CBE Studio, ..." required></textarea>
      </div>

      <button type="submit" id="send-btn">
        <span class="spinner"></span>
        <span id="btn-text">Send message</span>
      </button>

      <div id="status" class="status"></div>
    </form>

    <!-- Shown after a successful send (AJAX, no page reload) -->
    <div id="success" class="success">
      <div class="check">
        <svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
      </div>
      <h2>Message sent</h2>
      <p>Thanks for reaching out &mdash; I'll reply as soon as I can.</p>
      <p style="margin-top:12px"><a href="#" id="send-another">&larr; Send another message</a></p>
    </div>

    <div class="footer">
      <a href="https://github.com/CBE-STUDIO" target="_blank" rel="noopener">&copy; CBE-STUDIO &mdash; back to GitHub</a>
    </div>

  </main>

<script>
  const form    = document.getElementById('contact-form');
  const status  = document.getElementById('status');
  const success = document.getElementById('success');
  const btn     = document.getElementById('send-btn');
  const btnText = document.getElementById('btn-text');

  function setStatus(kind, text) {
    status.className = 'status ' + kind;
    status.textContent = text;
    status.style.display = 'block';
    setTimeout(() => { status.style.display = 'none'; }, 6000);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (btn.disabled) return;

    // loading state
    btn.disabled = true;
    btn.classList.add('loading');
    btnText.textContent = 'Sending...';

    try {
      const res = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });

      if (res.ok) {
        // smooth swap: fade out form, pop in success panel
        form.classList.add('out');
        status.style.display = 'none';
        setTimeout(() => {
          form.style.display = 'none';
          success.style.display = 'block';
        }, 300);
      } else {
        const data = await res.json().catch(() => ({}));
        setStatus('error', data.errors ? data.errors.map(e => e.message).join(', ') : 'Something went wrong. Please try again.');
      }
    } catch (err) {
      setStatus('error', 'Network error &mdash; please try again.');
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
      btnText.textContent = 'Send message';
    }
  });

  document.getElementById('send-another').addEventListener('click', (e) => {
    e.preventDefault();
    success.style.display = 'none';
    form.style.display = 'block';
    form.reset();
    requestAnimationFrame(() => form.classList.remove('out'));
  });
</script>

</body>
</html>
