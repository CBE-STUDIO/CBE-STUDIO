<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact &mdash; CBE Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d13;
    --card: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.09);
    --text: #e8ecf4;
    --muted: #8b93a5;
    --accent: #8b5cf6;
    --accent2: #c084fc;
    --violet-deep: #7c3aed;
    --violet-glow: #a855f7;
    --radius: 18px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    overflow-x: hidden;
    position: relative;
  }

  /* soft ambient glow blobs */
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.35;
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 520px; height: 520px;
    background: radial-gradient(circle, #7c3aed, transparent 70%);
    top: -160px; left: -120px;
    animation: drift 16s ease-in-out infinite alternate;
  }
  body::after {
    width: 460px; height: 460px;
    background: radial-gradient(circle, #a855f7, transparent 70%);
    bottom: -140px; right: -100px;
    animation: drift 20s ease-in-out infinite alternate-reverse;
  }

  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(40px, 30px) scale(1.15); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 44px 40px 40px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    display: block;
    width: 190px;
    margin: 0 auto 14px;
    filter: drop-shadow(0 6px 24px rgba(139, 92, 246, 0.35));
  }

  h1 {
    text-align: center;
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  h1 em {
    font-style: normal;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .sub {
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
    margin: 10px 0 32px;
    font-weight: 300;
  }

  .field { margin-bottom: 20px; }

  label {
    display: block;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  input, textarea {
    width: 100%;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    resize: vertical;
  }

  input::placeholder, textarea::placeholder { color: #565e70; }

  input:focus, textarea:focus {
    border-color: var(--accent);
    background: rgba(255, 255, 255, 0.06);
    box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.18);
  }

  textarea { min-height: 140px; }

  button {
    width: 100%;
    margin-top: 8px;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(120deg, var(--violet-deep), var(--violet-glow), var(--accent2));
    box-shadow: 0 10px 30px rgba(139, 92, 246, 0.35);
    transition: transform 0.2s, box-shadow 0.25s, filter 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  button:hover { transform: translateY(-2px); box-shadow: 0 16px 38px rgba(139, 92, 246, 0.5); filter: brightness(1.08); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  button.loading .spinner { display: inline-block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* inline status messages */
  .status {
    display: none;
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 0.92rem;
    text-align: center;
    animation: fadeIn 0.35s ease both;
  }
  .status.ok    { background: rgba(52, 211, 153, 0.12); border: 1px solid rgba(52, 211, 153, 0.4);  color: #6ee7b7; }
  .status.error { background: rgba(255, 77, 94, 0.10);  border: 1px solid rgba(255, 77, 94, 0.45);  color: #ffb3bb; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* success panel replaces the form */
  .success {
    display: none;
    text-align: center;
    padding: 34px 10px;
    animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .success .check {
    width: 74px; height: 74px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, #34d399, #22c55e);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 16px 44px rgba(52, 211, 153, 0.4);
    animation: pop 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.4) both;
  }
  .success .check svg { width: 34px; height: 34px; stroke: #fff; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .success h2 { font-size: 1.3rem; margin-bottom: 8px; }
  .success p  { color: var(--muted); font-size: 0.95rem; font-weight: 300; }
  .success a  { color: var(--accent); text-decoration: none; font-weight: 500; }
  .success a:hover { text-decoration: underline; }

  @keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  form.out { opacity: 0; transform: translateY(-10px); transition: opacity 0.35s, transform 0.35s; pointer-events: none; }

  .footer {
    text-align: center;
    margin-top: 26px;
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 300;
  }
  .footer a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
  .footer a:hover { color: var(--text); }

  @media (max-width: 480px) {
    .card { padding: 32px 22px 28px; }
    h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>

  <main class="card">

    <!-- CBE Studio logo -->
    <img class="logo" src="https://raw.githubusercontent.com/CBE-STUDIO/CBE-STUDIO/main/assets/cbe-studio-logo.png" alt="CBE Studio logo">

    <h1>Contact <em>CBE Studio</em></h1>
    <p class="sub">Have a question, feedback, or a project idea? Send a message &mdash; I'll get back to you.</p>

    <!-- Contact form -> Formspree -->
    <form id="contact-form" action="https://formspree.io/f/xyekdqjo" method="POST">
      <input type="hidden" name="_subject" value="New message from your website">

      <div class="field">
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" placeholder="Jane Doe" required>
      </div>

      <div class="field">
        <label for="email">Your email</label>
        <input type="email" id="email" name="_replyto" placeholder="jane@example.com" required>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Hi CBE Studio, ..." required></textarea>
      </div>

      <button type="submit" id="send-btn">
        <span class="spinner"></span>
        <span id="btn-text">Send message</span>
      </button>

      <div id="status" class="status"></div>
    </form>

    <!-- Shown after a successful send (AJAX, no page reload) -->
    <div id="success" class="success">
      <div class="check">
        <svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
      </div>
      <h2>Message sent!</h2>
      <p>Thanks for reaching out &mdash; I'll reply as soon as I can.</p>
      <p style="margin-top:12px"><a href="#" id="send-another">&larr; Send another message</a></p>
    </div>

    <div class="footer">
      <a href="https://github.com/CBE-STUDIO" target="_blank" rel="noopener">&copy; CBE-STUDIO &mdash; back to GitHub</a>
    </div>

  </main>

<script>
  const form    = document.getElementById('contact-form');
  const status  = document.getElementById('status');
  const success = document.getElementById('success');
  const btn     = document.getElementById('send-btn');
  const btnText = document.getElementById('btn-text');

  function setStatus(kind, text) {
    status.className = 'status ' + kind;
    status.textContent = text;
    status.style.display = 'block';
    setTimeout(() => { status.style.display = 'none'; }, 6000);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (btn.disabled) return;

    // loading state
    btn.disabled = true;
    btn.classList.add('loading');
    btnText.textContent = 'Sending...';

    try {
      const res = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });

      if (res.ok) {
        // smooth swap: fade out form, pop in success panel
        form.classList.add('out');
        status.style.display = 'none';
        setTimeout(() => {
          form.style.display = 'none';
          success.style.display = 'block';
        }, 350);
      } else {
        const data = await res.json().catch(() => ({}));
        setStatus('error', data.errors ? data.errors.map(e => e.message).join(', ') : 'Something went wrong. Please try again.');
      }
    } catch (err) {
      setStatus('error', 'Network error &mdash; please try again.');
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
      btnText.textContent = 'Send message';
    }
  });

  document.getElementById('send-another').addEventListener('click', (e) => {
    e.preventDefault();
    success.style.display = 'none';
    form.style.display = 'block';
    form.reset();
    // re-trigger the rise animation
    form.classList.remove('out');
    requestAnimationFrame(() => form.classList.remove('out'));
  });
</script>

</body>
</html>
